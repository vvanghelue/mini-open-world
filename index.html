<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Open World</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 8px; background: #0b0d10; z-index: 10; transition: opacity .4s; }
      #loading .bar { width: 280px; height: 3px; background: #222; border-radius: 2px; overflow: hidden; }
      #loading .bar > div { height: 100%; width: 0; background: #8cf; transition: width .2s; }
      #credits { position: fixed; right: 6px; bottom: 4px; z-index: 5; font-size: 10px; color: rgba(255,255,255,.55);
        text-shadow: 0 0 2px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="credits">Relief &amp; orthophotos © swisstopo · Copernicus DEM © DLR / Airbus (UE/ESA) · Bâtiments © contributeurs OpenStreetMap (ODbL) · Textures Poly Haven / ambientCG (CC0)</div>
    <div id="loading"><div id="loading-text">Chargement…</div><div class="bar"><div id="loading-bar"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
